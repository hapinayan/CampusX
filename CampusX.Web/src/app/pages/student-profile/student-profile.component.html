<div class="profile-page">

  <div class="profile-card">

    <div class="profile-header">

      <div>
        <h2>My Profile</h2>
        <p>Your CampusX student information</p>
      </div>

      <div class="header-actions">

        <button
          type="button"
          class="back-button"
          (click)="goToDashboard()"
        >
          ← Dashboard
        </button>

        <button
          *ngIf="student && !isEditing"
          class="edit-button"
          (click)="startEdit()"
        >
          Edit Profile
        </button>

      </div>

    </div>

    <div *ngIf="message" class="message">
      {{ message }}
    </div>

    <div *ngIf="student">

      <div class="profile-avatar">
        {{ student.fullName?.charAt(0) }}
      </div>

      <!-- VIEW MODE -->
      <div
        class="profile-info"
        *ngIf="!isEditing"
      >

        <div class="info-group">
          <label>Index Number</label>
          <p>{{ student.indexNumber }}</p>
        </div>

        <div class="info-group">
          <label>Full Name</label>
          <p>{{ student.fullName }}</p>
        </div>

        <div class="info-group">
          <label>Email</label>
          <p>{{ student.email }}</p>
        </div>

        <div class="info-group">
          <label>Faculty</label>
          <p>{{ student.faculty }}</p>
        </div>

        <div class="info-group">
          <label>Contact Number</label>
          <p>
            {{ student.contactNumber || 'Not provided' }}
          </p>
        </div>

        <div class="info-group">
          <label>Account Status</label>
          <p>
            {{ student.isActive ? 'Active' : 'Inactive' }}
          </p>
        </div>

      </div>

      <!-- EDIT MODE -->
      <form
        *ngIf="isEditing"
        class="edit-form"
        (ngSubmit)="updateProfile()"
      >

        <div class="form-group">
          <label>Index Number</label>

          <input
            type="text"
            [value]="student.indexNumber"
            disabled
          />
        </div>

        <div class="form-group">
          <label>Full Name</label>

          <input
            type="text"
            name="fullName"
            [(ngModel)]="editData.fullName"
            required
          />
        </div>

        <div class="form-group">
          <label>Email</label>

          <input
            type="email"
            name="email"
            [(ngModel)]="editData.email"
            required
          />
        </div>

        <div class="form-group">
          <label>Faculty</label>

          <select
            name="faculty"
            [(ngModel)]="editData.faculty"
            required
          >
            <option value="Computing">Computing</option>
            <option value="Business">Business</option>
            <option value="Engineering">Engineering</option>
            <option value="Science">Science</option>
          </select>
        </div>

        <div class="form-group">
          <label>Contact Number</label>

          <input
            type="text"
            name="contactNumber"
            [(ngModel)]="editData.contactNumber"
          />
        </div>

        <div class="form-actions">

          <button
            type="button"
            class="cancel-button"
            (click)="cancelEdit()"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="save-button"
          >
            Save Changes
          </button>

        </div>

      </form>

    </div>

  </div>

</div>
