<div class="register-page">

  <div class="register-container">

    <div class="register-left">

      <div class="register-content">

        <h1>Create Account</h1>

        <p class="register-subtitle">
          Register your CampusX student account
        </p>

        <form (ngSubmit)="register()">

          <div class="form-row">

            <div class="form-group">
              <label>Index Number</label>
              <input
                type="text"
                name="indexNumber"
                [(ngModel)]="indexNumber"
                placeholder="Enter index number"
                required
              />
            </div>

            <div class="form-group">
              <label>Full Name</label>
              <input
                type="text"
                name="fullName"
                [(ngModel)]="fullName"
                placeholder="Enter full name"
                required
              />
            </div>

          </div>

          <div class="form-row">

            <div class="form-group">
              <label>Email</label>
              <input
                type="email"
                name="email"
                [(ngModel)]="email"
                placeholder="Enter email"
                required
              />
            </div>

            <div class="form-group">
              <label>Faculty</label>

              <select
                name="faculty"
                [(ngModel)]="faculty"
                required
              >
                <option value="">
                  Select faculty
                </option>

                <option value="Computing">
                  Computing
                </option>

                <option value="Business">
                  Business
                </option>

                <option value="Engineering">
                  Engineering
                </option>

                <option value="Science">
                  Science
                </option>
              </select>
            </div>

          </div>

          <div class="form-group">
            <label>Contact Number</label>
            <input
              type="text"
              name="contactNumber"
              [(ngModel)]="contactNumber"
              placeholder="Enter contact number"
            />
          </div>

          <div class="form-row">

            <div class="form-group">
              <label>Password</label>
              <input
                type="password"
                name="password"
                [(ngModel)]="password"
                placeholder="Enter password"
                required
              />
            </div>

            <div class="form-group">
              <label>Confirm Password</label>
              <input
                type="password"
                name="confirmPassword"
                [(ngModel)]="confirmPassword"
                placeholder="Confirm password"
                required
              />
            </div>

          </div>

          <button
            type="submit"
            class="register-button"
          >
            REGISTER
          </button>

        </form>

        <div
          class="message"
          *ngIf="message"
        >
          {{ message }}
        </div>

        <p class="login-text">
          Already have an account?
          <a href="/login">
            Login
          </a>
        </p>

      </div>

    </div>


    <div class="register-right">

      <div class="welcome-content">

        <h2>Join</h2>

        <h3>CampusX</h3>

        <p>
          Create your student account and access
          university services, activities and requests
          from one smart campus portal.
        </p>

        <div class="campus-icon">
          🎓
        </div>

      </div>

    </div>

  </div>

</div>
