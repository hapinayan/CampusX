<div class="login-page">

  <div class="login-container">

    <!-- LEFT SIDE -->
    <div class="login-left">

      <div class="login-content">

        <h1>Student Login</h1>

        <p class="login-subtitle">
          Hey, enter your details to sign in to your account
        </p>

        <form (ngSubmit)="login()">

          <div class="form-group">
            <label>Email</label>

            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label>Password</label>

            <input
              type="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="login-options">

            <label class="remember">
              <input type="checkbox" />
              Remember me
            </label>

            <a href="#" class="forgot-password">
              Forgot password?
            </a>

          </div>

          <button
            type="submit"
            class="login-button"
          >
            LOGIN
          </button>

        </form>

        <div
          class="message"
          *ngIf="message"
        >
          {{ message }}
        </div>

        <p class="register-text">
          Not registered yet?
          <a href="/register">Create an account</a>
        </p>

      </div>

    </div>


    <!-- RIGHT SIDE -->
    <div class="login-right">

      <div class="welcome-content">

        <h2>Welcome</h2>

        <h3>to CampusX</h3>

        <p>
          Your smart university campus services portal.
          Access your profile, campus services,
          activities and academic requests in one place.
        </p>

        <div class="book-design">

          <div class="book book1"></div>

          <div class="book book2"></div>

          <div class="book book3"></div>

          <div class="book book4"></div>

          <div class="open-book">
            📖
          </div>

          <div class="study-items">
            ☕ 🎓
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
